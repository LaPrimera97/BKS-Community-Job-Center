[build]
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "https://bkscommunityjobcenter.netlify.app/*"
  to = "https://bkscommunityjobcenter.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/server.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/Dockerfile"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docker-compose.yml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase-migration.sql"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.py"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
