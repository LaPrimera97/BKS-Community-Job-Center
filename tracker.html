<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" href="/favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<title>My Applications — BKS Community Job Center</title>
<style>
:root{
  --green-deep:#042e24;
  --green-dark:#064e3b;
  --green-mid:#0F6E56;
  --green-vivid:#1D9E75;
  --green-light:#E1F5EE;
  --green-pale:#f0faf5;
  --gold:#ffd700;
  --cream:#eaf2ec;
  --ink:#1a2e20;
  --muted:#57534e;
  --border:#e5e0dc;
  --font-display:'Playfair Display',Georgia,serif;
  --font-body:'DM Sans',Arial,sans-serif;
  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:24px;
  --radius-xl:32px;
  --shadow-sm:0 1px 8px rgba(6,78,59,.07);
  --shadow-md:0 4px 20px rgba(6,78,59,.12);
  --shadow-lg:0 12px 40px rgba(6,78,59,.18);
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font-body);
  background:var(--cream);
  color:var(--ink);
  font-size:16px;
  line-height:1.7;
  min-height:100vh;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}


.site-header{
  background:linear-gradient(135deg,var(--green-deep) 0%,var(--green-dark) 60%,#0a6b50 100%);
  position:sticky;top:0;z-index:200;
  box-shadow:0 3px 24px rgba(0,0,0,.35);
  border-bottom:3px solid var(--gold);
  overflow:hidden;
}
#headerCanvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
.header-inner{
  max-width:1040px;margin:0 auto;
  padding:14px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  position:relative;z-index:2;
}
.hdr-logo img{max-width:120px;display:block;cursor:pointer;transition:opacity .2s,transform .2s;}
.hdr-logo img:hover{opacity:.85;transform:scale(1.03);}
.hdr-title{flex:1;min-width:0;}
.hdr-title h1{font-family:var(--font-display);font-size:clamp(15px,2.8vw,20px);font-weight:700;color:white;line-height:1.2;letter-spacing:-.01em;}
.hdr-title p{font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;text-transform:uppercase;letter-spacing:.07em;}
.hdr-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.lang-switcher{display:flex;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:22px;overflow:hidden;}
.lang-btn{padding:5px 13px;font-size:11px;font-weight:700;cursor:pointer;color:rgba(255,255,255,.6);background:transparent;border:none;transition:all .2s;letter-spacing:.05em;font-family:var(--font-body);}
.lang-btn.active{background:var(--gold);color:var(--green-dark);}
.lang-btn:hover:not(.active){color:white;}
.hdr-back{
  color:rgba(255,255,255,.72);text-decoration:none;font-size:12px;font-weight:600;
  display:flex;align-items:center;gap:5px;padding:7px 15px;
  border-radius:20px;border:1px solid rgba(255,255,255,.18);
  transition:all .2s;white-space:nowrap;font-family:var(--font-body);
}
.hdr-back:hover{background:rgba(255,255,255,.1);color:white;}
.hdr-back svg{width:13px;height:13px;}


.hero-strip{
  background:linear-gradient(135deg,var(--green-deep) 0%,var(--green-dark) 100%);
  padding:28px 28px 24px;
  border-bottom:3px solid rgba(255,215,0,.2);
  position:relative;overflow:hidden;
}
#heroCanvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
.hero-strip-inner{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;position:relative;z-index:2;}
.hero-strip-text h2{font-family:var(--font-display);font-size:clamp(18px,3vw,26px);font-weight:700;color:white;}
.hero-strip-text h2 .gold{color:var(--gold);}
.hero-strip-text p{font-size:13px;color:rgba(255,255,255,.55);margin-top:6px;font-weight:400;}
.hero-strip-badge{
  background:rgba(255,215,0,.1);border:1.5px solid rgba(255,215,0,.28);
  border-radius:var(--radius-md);padding:12px 24px;text-align:center;flex-shrink:0;
}
.badge-num{font-family:var(--font-display);font-size:32px;font-weight:700;color:var(--gold);line-height:1;}
.badge-lbl{font-size:10px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.07em;margin-top:4px;font-family:var(--font-body);}


.page{max-width:1040px;margin:0 auto;padding:30px 28px 80px;flex:1;}


.signin-wall{
  background:white;border-radius:var(--radius-xl);padding:48px 40px;
  max-width:480px;margin:36px auto;text-align:center;
  box-shadow:var(--shadow-lg);
  border-top:5px solid var(--green-vivid);
}
.wall-icon{font-size:56px;margin-bottom:18px;}
.signin-wall h2{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--green-dark);margin-bottom:10px;}
.signin-wall > p{font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.7;}
.btn-green{
  background:linear-gradient(135deg,var(--green-vivid),var(--green-mid));color:white;
  padding:13px 34px;border-radius:40px;font-weight:700;font-size:14px;
  border:none;cursor:pointer;transition:all .3s;display:inline-block;
  text-decoration:none;box-shadow:0 5px 16px rgba(29,158,117,.35);
  letter-spacing:.03em;font-family:var(--font-body);
}
.btn-green:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(29,158,117,.45);}
.btn-ghost{
  background:white;color:var(--green-dark);padding:12px 26px;border-radius:40px;
  font-weight:600;font-size:14px;border:2px solid var(--green-dark);
  cursor:pointer;transition:all .3s;display:inline-block;text-decoration:none;font-family:var(--font-body);
}
.btn-ghost:hover{background:var(--green-dark);color:white;}


.auth-tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:22px;}
.auth-tab{flex:1;padding:10px;text-align:center;font-weight:700;font-size:13px;cursor:pointer;color:#78716c;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s;font-family:var(--font-body);}
.auth-tab.active{color:var(--green-dark);border-bottom-color:var(--green-vivid);}
.auth-panel{display:none;text-align:left;}
.auth-panel.active{display:block;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;margin-bottom:5px;font-weight:700;font-size:11px;color:var(--ink);text-transform:uppercase;letter-spacing:.05em;font-family:var(--font-body);}
.form-group input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;background:#fafaf9;font-family:var(--font-body);color:var(--ink);}
.form-group input:focus{border-color:var(--green-vivid);background:white;box-shadow:0 0 0 4px rgba(29,158,117,.1);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.auth-msg{padding:11px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px;display:none;line-height:1.6;}
.auth-msg.success{background:#e8f8f1;color:#0F6E56;border:1px solid #b6e8d0;display:block;}
.auth-msg.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;display:block;}
.pass-bar{height:4px;border-radius:2px;margin-top:5px;background:var(--border);transition:all .3s;}
.pass-bar.weak{background:#dc2626;width:33%;}
.pass-bar.medium{background:#f59e0b;width:66%;}
.pass-bar.strong{background:var(--green-vivid);width:100%;}


.welcome-bar{
  background:white;border-radius:var(--radius-md);padding:18px 24px;
  margin-bottom:24px;display:flex;align-items:center;
  justify-content:space-between;flex-wrap:wrap;gap:14px;
  box-shadow:var(--shadow-sm);
  border-left:5px solid var(--green-vivid);
}
.welcome-greet{font-family:var(--font-body);font-size:16px;font-weight:700;color:var(--green-dark);}
.welcome-sub{font-size:12px;color:#78716c;margin-top:3px;font-weight:400;}
.signout-btn{
  background:#fef2f2;color:#991b1b;border:1.5px solid #fecaca;
  padding:8px 18px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;
  transition:all .2s;font-family:var(--font-body);
}
.signout-btn:hover{background:#991b1b;color:white;border-color:#991b1b;}


.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:30px;}
.sum-card{
  background:white;border-radius:var(--radius-md);padding:20px 16px;text-align:center;
  box-shadow:var(--shadow-sm);border-top:4px solid var(--border);
  transition:transform .2s,box-shadow .2s;
}
.sum-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
.sum-card.c-total{border-top-color:var(--green-dark);}
.sum-card.c-pending{border-top-color:#f59e0b;}
.sum-card.c-reviewed{border-top-color:#3b82f6;}
.sum-card.c-shortlisted{border-top-color:var(--green-vivid);}
.sum-num{font-family:var(--font-display);font-size:34px;font-weight:700;color:var(--green-dark);line-height:1;}
.c-pending .sum-num{color:#854d0e;}
.c-reviewed .sum-num{color:#1e3a8a;}
.c-shortlisted .sum-num{color:#065f46;}
.sum-lbl{font-size:10px;color:#78716c;margin-top:6px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-family:var(--font-body);}


.sec-heading{
  font-family:var(--font-body);font-size:11px;font-weight:700;color:var(--green-mid);margin-bottom:16px;
  display:flex;align-items:center;gap:10px;
  text-transform:uppercase;letter-spacing:.09em;
}
.sec-heading::after{content:"";flex:1;height:2px;background:linear-gradient(to right,var(--green-vivid) 0%,transparent 100%);}


.app-card{
  background:white;border-radius:var(--radius-xl);margin-bottom:24px;
  box-shadow:var(--shadow-sm);overflow:hidden;border:1px solid var(--border);
  transition:box-shadow .25s,transform .25s;
}
.app-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}

.card-head{
  padding:20px 26px;display:flex;align-items:flex-start;
  justify-content:space-between;gap:16px;flex-wrap:wrap;
  border-bottom:1px solid #f0ebe6;
}
.card-head.h-Pending   {border-left:6px solid #f59e0b;background:linear-gradient(135deg,#fffdf4 0%,white 70%);}
.card-head.h-Reviewed  {border-left:6px solid #3b82f6;background:linear-gradient(135deg,#f5f9ff 0%,white 70%);}
.card-head.h-Shortlisted{border-left:6px solid var(--green-vivid);background:linear-gradient(135deg,var(--green-pale) 0%,white 70%);}
.card-head.h-Rejected  {border-left:6px solid #dc2626;background:linear-gradient(135deg,#fff5f5 0%,white 70%);}
.card-job-name{font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.card-meta{font-size:12px;color:#78716c;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.meta-sep{width:3px;height:3px;background:#c8c4c0;border-radius:50%;}
.elapsed-chip{
  background:var(--green-pale);color:var(--green-mid);font-size:11px;font-weight:700;
  padding:2px 10px;border-radius:20px;border:1px solid #c6e8d4;font-family:var(--font-body);
}


.s-pill{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 16px;border-radius:24px;font-size:11px;font-weight:700;
  white-space:nowrap;letter-spacing:.04em;flex-shrink:0;font-family:var(--font-body);
}
.s-pill .dot{width:7px;height:7px;border-radius:50%;}
.pill-Pending    {background:#fef9c3;color:#854d0e;}   .pill-Pending .dot{background:#f59e0b;}
.pill-Reviewed   {background:#dbeafe;color:#1e3a8a;}   .pill-Reviewed .dot{background:#3b82f6;}
.pill-Shortlisted{background:#d1fae5;color:#065f46;}   .pill-Shortlisted .dot{background:var(--green-vivid);}
.pill-Rejected   {background:#fee2e2;color:#7f1d1d;}   .pill-Rejected .dot{background:#dc2626;}


.stepper-wrap{padding:22px 26px;border-bottom:1px solid #f0ebe6;}
.steps{display:flex;align-items:flex-start;}
.step{display:flex;flex-direction:column;align-items:center;flex:1;}
.step-circle{
  width:38px;height:38px;border-radius:50%;
  border:2.5px solid var(--border);background:white;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-body);font-size:13px;font-weight:700;color:#a8a29e;
  transition:all .35s;z-index:1;
}
.step-circle svg{width:15px;height:15px;}
.step.st-done .step-circle{background:linear-gradient(135deg,var(--green-vivid),var(--green-mid));border-color:var(--green-vivid);color:white;box-shadow:0 2px 10px rgba(29,158,117,.4);}
.step.st-active .step-circle{background:linear-gradient(135deg,var(--green-dark),#0a6b50);border-color:var(--green-dark);color:white;animation:stepPulse 2s ease-in-out infinite;}
.step.st-rejected .step-circle{background:linear-gradient(135deg,#dc2626,#b91c1c);border-color:#dc2626;color:white;}
@keyframes stepPulse{0%,100%{box-shadow:0 0 0 5px rgba(6,78,59,.15);}50%{box-shadow:0 0 0 12px rgba(6,78,59,.05);}}
.step-lbl{font-size:10px;color:#a8a29e;margin-top:8px;text-align:center;font-weight:700;text-transform:uppercase;letter-spacing:.05em;line-height:1.3;font-family:var(--font-body);}
.step.st-done .step-lbl,.step.st-active .step-lbl{color:var(--green-dark);}
.step.st-rejected .step-lbl{color:#dc2626;}
.step-bar{flex:1;height:3px;background:var(--border);margin:0 -1px;margin-bottom:26px;border-radius:2px;transition:background .4s;}
.step-bar.done{background:linear-gradient(to right,var(--green-vivid),var(--green-mid));}


.status-msg-wrap{padding:18px 26px;border-bottom:1px solid #f0ebe6;}
.status-msg-box{border-radius:var(--radius-md);padding:16px 18px;display:flex;gap:16px;align-items:flex-start;}
.status-msg-box.bx-Pending   {background:#fffbeb;border:1.5px solid #fde68a;}
.status-msg-box.bx-Reviewed  {background:#eff6ff;border:1.5px solid #bfdbfe;}
.status-msg-box.bx-Shortlisted{background:#f0fdf4;border:1.5px solid #86efac;}
.status-msg-box.bx-Rejected  {background:#fef2f2;border:1.5px solid #fecaca;}
.msg-icon{font-size:28px;line-height:1;flex-shrink:0;}
.msg-body h4{font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.msg-body p{font-size:13px;color:var(--muted);line-height:1.7;margin:0;}
.msg-next{font-size:12px;color:#78716c;margin-top:12px;padding-top:12px;border-top:1px dashed rgba(0,0,0,.1);display:flex;align-items:flex-start;gap:6px;line-height:1.65;}
.msg-next-arrow{flex-shrink:0;}


.timeline-wrap{padding:20px 26px;}
.tl-heading{font-family:var(--font-body);font-size:11px;font-weight:700;color:#78716c;text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.tl-heading::after{content:"";flex:1;height:1px;background:var(--border);}
.tl-item{display:flex;gap:14px;margin-bottom:18px;}
.tl-item:last-child{margin-bottom:0;}
.tl-left{display:flex;flex-direction:column;align-items:center;width:34px;flex-shrink:0;}
.tl-dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;border:2px solid transparent;}
.tl-dot.ev-Submitted   {background:var(--green-light);border-color:#b6e8d0;color:var(--green-mid);}
.tl-dot.ev-StatusChanged{background:#dbeafe;border-color:#bfdbfe;color:#1e3a8a;}
.tl-dot.ev-System      {background:#f3f4f6;border-color:var(--border);color:#6b7280;}
.tl-vline{flex:1;width:2px;background:var(--border);margin-top:4px;border-radius:1px;}
.tl-content{flex:1;}
.tl-ev-label{font-size:13px;font-weight:700;color:var(--ink);font-family:var(--font-body);}
.tl-ev-detail{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.55;}
.tl-ev-time{font-size:11px;color:#a8a29e;margin-top:5px;display:flex;align-items:center;gap:6px;}
.tl-ev-time .sep{color:var(--border);}


.loading-state{text-align:center;padding:80px 24px;}
.spinner{display:inline-block;width:46px;height:46px;border:4px solid var(--border);border-top-color:var(--green-vivid);border-radius:50%;animation:spin .9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-state p{margin-top:18px;color:#78716c;font-size:14px;font-weight:400;}
.empty-state{background:white;border-radius:var(--radius-xl);padding:64px 36px;text-align:center;box-shadow:var(--shadow-sm);border-top:5px solid var(--green-vivid);}
.empty-big-icon{font-size:60px;margin-bottom:20px;}
.empty-state h3{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--green-dark);margin-bottom:12px;}
.empty-state p{font-size:14px;color:var(--muted);margin-bottom:30px;line-height:1.7;max-width:400px;margin-left:auto;margin-right:auto;}


.site-footer{
  background:linear-gradient(135deg,var(--green-deep),#0a1f17);
  padding:28px;text-align:center;margin-top:auto;
  position:relative;overflow:hidden;
}
#footerCanvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
.site-footer p{font-size:12px;color:rgba(255,255,255,.3);position:relative;z-index:2;}
.site-footer a{color:rgba(255,255,255,.45);text-decoration:none;margin:0 10px;transition:color .2s;font-weight:500;}
.site-footer a:hover{color:rgba(255,255,255,.75);}


@media(max-width:680px){
  .summary-grid{grid-template-columns:repeat(2,1fr);}
  .page{padding:20px 18px 60px;}
  .hdr-title h1{font-size:14px;}
  .step-lbl{font-size:9px;}
  .form-row{grid-template-columns:1fr;}
  .hero-strip-badge{display:none;}
  .card-head,.stepper-wrap,.status-msg-wrap,.timeline-wrap{padding:16px 18px;}
  .signin-wall{padding:32px 24px;}
  .card-job-name{font-size:16px;}
  .header-inner{padding:12px 18px;}
}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;}
}
</style>
</head>
<body>

<header class="site-header">
  <canvas id="headerCanvas" aria-hidden="true"></canvas>
  <div class="header-inner">
    <div class="hdr-logo">
      <a id="hdrLogoLink" href="/portal.html">
        <img src="https://drive.google.com/thumbnail?id=1idJ5CgHUVJ98YP8frCLbeDexMPkmraLn&sz=w300" alt="BKS Logo">
      </a>
    </div>
    <div class="hdr-title">
      <h1 id="hdrH1">My Applications</h1>
      <p id="hdrSub">BKS Community Job Center — Application Tracker</p>
    </div>
    <div class="hdr-right">
      <div class="lang-switcher">
        <button class="lang-btn active" id="btnEN">ENG</button>
        <button class="lang-btn" id="btnNSO">Sepedi</button>
      </div>
      <a class="hdr-back" id="hdrBack" href="/portal.html">
        <svg fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        <span id="hdrBackLabel">Back to Portal</span>
      </a>
    </div>
  </div>
</header>

<div class="hero-strip" id="heroStrip" style="display:none;">
  <canvas id="heroCanvas" aria-hidden="true"></canvas>
  <div class="hero-strip-inner">
    <div class="hero-strip-text">
      <h2 id="heroTitle">Track Your <span class="gold">Journey</span></h2>
      <p id="heroSub">Real-time status updates on every application you have submitted through BKS.</p>
    </div>
    <div class="hero-strip-badge">
      <div class="badge-num" id="badgeNum">0</div>
      <div class="badge-lbl" id="badgeLbl">Applications</div>
    </div>
  </div>
</div>

<main class="page" id="mainPage">
  <div class="loading-state">
    <div class="spinner"></div>
    <p id="loadingText">Loading your tracker…</p>
  </div>
</main>

<footer class="site-footer">
  <canvas id="footerCanvas" aria-hidden="true"></canvas>
  <p>
    <a id="ftPortalLink" href="/portal.html">&#8592; Job Portal</a>
    &bull; BKS Community Job Center &copy; 2026 &bull;
    <a id="ftPrivacyLink" href="/privacy.html">Privacy Notice</a>
  </p>
</footer>

<script>

var currentUser = null;
var LANG        = 'en';


function makeParticles(canvasEl, gold, count){
  if(!canvasEl) return;
  var ctx = canvasEl.getContext('2d'), W, H, pts = [];
  function rsz(){
    W = canvasEl.width  = canvasEl.parentElement.offsetWidth  || window.innerWidth;
    H = canvasEl.height = canvasEl.parentElement.offsetHeight || 200;
  }
  rsz(); window.addEventListener('resize', rsz, {passive:true});
  var col = gold ? '255,215,0' : '29,158,117';
  var alpha = gold ? 0.22 : 0.14;
  for(var i = 0; i < (count||40); i++){
    pts.push({
      x:Math.random()*2000, y:Math.random()*600,
      r:Math.random()*1.8+.4,
      dx:(Math.random()-.5)*.28, dy:(Math.random()-.5)*.22,
      o:Math.random()*alpha+alpha*.4
    });
  }
  (function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(function(p){
      ctx.beginPath(); ctx.arc(p.x%W, p.y%H, p.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba('+col+','+p.o+')'; ctx.fill();
      p.x+=p.dx; p.y+=p.dy;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0;
    });
    requestAnimationFrame(draw);
  })();
}

function escHtml(s){ if(!s)return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function elapsed(ts){
  if(!ts)return '';
  var d=new Date(ts); if(isNaN(d.getTime()))return '';
  var diff=Math.floor((Date.now()-d.getTime())/1000);
  var e=tl('elapsed');
  if(diff<60)   return e.just;
  if(diff<3600) return Math.floor(diff/60)+e.mins;
  if(diff<86400)return Math.floor(diff/3600)+e.hrs;
  var days=Math.floor(diff/86400);
  if(days===1)  return e.yesterday;
  if(days<30)   return days+e.days;
  if(days<365)  return Math.floor(days/30)+e.months;
  return Math.floor(days/365)+e.years;
}

function renderTracker(apps, events){
  window._lastApps   = apps;
  window._lastEvents = events;
  var strip = document.getElementById('heroStrip');
  strip.style.display='';
  document.getElementById('badgeNum').textContent = apps.length;
  initHeroParticles();

  var p=document.getElementById('mainPage'), html='';

  html+='<div class="welcome-bar">';
  html+='<div><div class="welcome-greet">'+escHtml(tl('welcomeGreet'))+' <strong>'+escHtml(currentUser.fullName)+'</strong></div>';
  html+='<div class="welcome-sub">'+apps.length+' '+escHtml(tl('welcomeSub'))+'</div></div>';
  html+='<button class="signout-btn" id="signoutBtn">'+escHtml(tl('btnSignOut'))+'</button>';
  html+='</div>';

  var cnt={Pending:0,Reviewed:0,Shortlisted:0,Rejected:0};
  apps.forEach(function(a){if(cnt[a.status]!==undefined)cnt[a.status]++;else cnt.Pending++;});
  html+='<div class="summary-grid">';
  html+='<div class="sum-card c-total"><div class="sum-num">'+apps.length+'</div><div class="sum-lbl">'+escHtml(tl('lblTotal'))+'</div></div>';
  html+='<div class="sum-card c-pending"><div class="sum-num">'+cnt.Pending+'</div><div class="sum-lbl">'+escHtml(tl('lblPending'))+'</div></div>';
  html+='<div class="sum-card c-reviewed"><div class="sum-num">'+cnt.Reviewed+'</div><div class="sum-lbl">'+escHtml(tl('lblReviewed'))+'</div></div>';
  html+='<div class="sum-card c-shortlisted"><div class="sum-num">'+cnt.Shortlisted+'</div><div class="sum-lbl">'+escHtml(tl('lblShortlisted'))+'</div></div>';
  html+='</div>';

  if(!apps.length){
    html+='<div class="empty-state"><div class="empty-big-icon">&#128188;</div>';
    html+='<h3>'+escHtml(tl('emptyTitle'))+'</h3><p>'+escHtml(tl('emptySub'))+'</p>';
    html+='<a class="btn-green" href="/portal.html#jobs">'+escHtml(tl('btnBrowse'))+'</a></div>';
    p.innerHTML=html; afterRender(); return;
  }

  html+='<div class="sec-heading">&#128203; '+escHtml(tl('secApps'))+'</div>';

  apps.forEach(function(app){
    var status  = app.status||'Pending';
    var cfg     = tlCfg(status);
    var isRej   = status==='Rejected';
    var jobEvs  = (events||[]).filter(function(ev){return ev.jobId===app.jobId;});
    var stepMap = {Pending:0,Reviewed:1,Shortlisted:2,Rejected:2};
    var activeIdx= isRej?2:(stepMap[status]!==undefined?stepMap[status]:0);
    var stepDefs = isRej
      ? [tl('stSubmitted'),tl('stReviewed'),tl('stUnsuccessful')]
      : [tl('stSubmitted'),tl('stReviewed'),tl('stShortlisted'),tl('stOutcome')];

    html+='<div class="app-card">';

    html+='<div class="card-head h-'+escHtml(status)+'">';
    html+='<div><div class="card-job-name">'+escHtml(app.jobId)+'</div>';
    html+='<div class="card-meta"><span>'+escHtml(tl('lblSubmitted'))+' '+escHtml(app.timestamp)+'</span>';
    if(app.timestamp){html+='<span class="meta-sep"></span><span class="elapsed-chip">'+elapsed(app.timestamp)+'</span>';}
    html+='</div></div>';
    html+='<span class="s-pill pill-'+escHtml(status)+'"><span class="dot"></span>'+escHtml(status)+'</span>';
    html+='</div>';

    html+='<div class="stepper-wrap"><div class="steps">';
    stepDefs.forEach(function(lbl,idx){
      var isDone =idx<activeIdx;
      var isAct  =idx===activeIdx;
      var isRejEnd=isRej&&idx===stepDefs.length-1;
      var cls    =isDone?'st-done':isAct?(isRejEnd?'st-rejected':'st-active'):'';
      var inner  =isDone
        ?'<svg fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
        :isRejEnd?'&#10005;':(idx+1);
      html+='<div class="step '+cls+'"><div class="step-circle">'+inner+'</div><div class="step-lbl">'+escHtml(lbl)+'</div></div>';
      if(idx<stepDefs.length-1) html+='<div class="step-bar'+(isDone?' done':'')+'"></div>';
    });
    html+='</div></div>';

    html+='<div class="status-msg-wrap"><div class="status-msg-box bx-'+escHtml(status)+'">';
    html+='<div class="msg-icon">'+cfg.icon+'</div>';
    html+='<div class="msg-body"><h4>'+escHtml(cfg.headline)+'</h4><p>'+escHtml(cfg.msg)+'</p>';
    html+='<div class="msg-next"><span class="msg-next-arrow">&#128073;</span><span>'+escHtml(cfg.next)+'</span></div>';
    html+='</div></div></div>';

    if(jobEvs.length){
      html+='<div class="timeline-wrap"><div class="tl-heading">'+escHtml(tl('tlHeading'))+'</div>';
      jobEvs.forEach(function(ev,idx){
        var last=idx===jobEvs.length-1;
        var evT =ev.eventType;
        var cls =evT==='Submitted'?'ev-Submitted':evT==='StatusChanged'?'ev-StatusChanged':'ev-System';
        var icon=evT==='Submitted'?'&#128228;':evT==='StatusChanged'?'&#128260;':'&#9881;&#65039;';
        var lbl =evT==='Submitted'?tl('evSubmitted'):evT==='StatusChanged'?tl('evStatusChanged'):tl('evSystem');
        html+='<div class="tl-item"><div class="tl-left"><div class="tl-dot '+cls+'">'+icon+'</div>';
        if(!last)html+='<div class="tl-vline"></div>';
        html+='</div><div class="tl-content"><div class="tl-ev-label">'+escHtml(lbl)+'</div>';
        html+='<div class="tl-ev-detail">'+escHtml(ev.detail)+'</div>';
        html+='<div class="tl-ev-time"><span>'+escHtml(ev.timestamp)+'</span>';
        if(ev.timestamp)html+='<span class="sep">\u00B7</span><span>'+elapsed(ev.timestamp)+'</span>';
        html+='</div></div></div>';
      });
      html+='</div>';
    }
    html+='</div>';
  });

  p.innerHTML=html;
  afterRender();
}

  })
    .then(function(r){ return r.json(); })
    .then(function(r){ renderTracker(r.apps||[],r.events||[]); })
    .catch(function(e){
      document.getElementById('mainPage').innerHTML=
        '<div class="empty-state"><div class="empty-big-icon">&#9888;&#65039;</div>'+
        '<h3>'+escHtml(tl('errTitle'))+'</h3><p>'+escHtml(tl('errSub'))+'</p>'+
        '<p style="font-size:11px;color:#a8a29e;margin-top:6px;">'+(e.message||e)+'</p></div>';
    });
}


function startTracker(){
  var savedLang='en';
  try{savedLang=localStorage.getItem('bksLang')||'en';}catch(e){}
  LANG=savedLang;
  document.getElementById('btnEN').classList.toggle('active',LANG==='en');
  document.getElementById('btnNSO').classList.toggle('active',LANG==='nso');
  applyLang(LANG);
  var saved=sessionStorage.getItem('bksUser');
  if(saved){try{currentUser=JSON.parse(saved);}catch(e){currentUser=null;}}
  if(currentUser&&currentUser.email){ loadData(); }
  else{ renderSignIn(); }
}
window.addEventListener('load', startTracker);
</script>
</body>
</html>
